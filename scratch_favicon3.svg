<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#093326" />
      <stop offset="60%" stop-color="#041b14" />
      <stop offset="100%" stop-color="#020e0a" />
    </linearGradient>

    <!-- Outer Border Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
  </defs>

  <!-- Squircle Base with clean emerald border -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="16" />

  <!-- Top Wing Bar -->
  <path d="M 54 132 L 458 132 L 436 158 L 76 158 Z" fill="url(#wingGrad)" />

  <!-- Outer Shield Badge -->
  <path d="M 104 162 
           L 408 162 
           L 408 198 
           L 352 288 
           L 256 388 
           L 160 288 
           L 104 198 Z" 
        fill="url(#shieldGrad)" 
        stroke="#86efac" 
        stroke-width="8" 
        stroke-linejoin="round" />

  <!-- Inner Contrast Shield -->
  <path d="M 130 178 
           L 382 178 
           L 382 202 
           L 334 278 
           L 256 358 
           L 178 278 
           L 130 202 Z" 
        fill="#15803d" />

  <!-- Lower Chevron Arrow -->
  <path d="M 144 308 
           L 256 426 
           L 368 308 
           L 390 326 
           L 256 466 
           L 122 326 Z" 
        fill="url(#wingGrad)" 
        stroke="#86efac" 
        stroke-width="5" 
        stroke-linejoin="round" />

  <!-- Monogram JE Text (Bold & Ultra-Crisp) -->
  <text x="256" y="254" 
        font-family="system-ui, -apple-system, 'Outfit', 'Inter', 'Arial Black', sans-serif" 
        font-size="132" 
        font-weight="900" 
        letter-spacing="2"
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central">JE</text>
</svg>
