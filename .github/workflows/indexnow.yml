name: IndexNow after production deploy

# Vercel reports each deployment to GitHub; when the production one goes
# live, tell IndexNow which pages changed (by sitemap <lastmod>).
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      days:
        description: "Submit pages changed in the last N days"
        default: "3"

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/indexnow-submit.mjs --days "${{ github.event.inputs.days || '3' }}"
