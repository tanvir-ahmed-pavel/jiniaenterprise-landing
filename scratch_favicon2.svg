<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Luxury Emerald Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#082b20" />
      <stop offset="60%" stop-color="#041812" />
      <stop offset="100%" stop-color="#020d09" />
    </linearGradient>

    <!-- Outer Glow Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <!-- Wing Gradient -->
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="50%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="12" />

  <!-- Inner Ambient Glow behind crest -->
  <circle cx="256" cy="256" r="140" fill="#22c55e" opacity="0.15" filter="blur(20px)" />

  <g filter="url(#shadow)">
    <!-- Top Horizontal Wings / Bar -->
    <path d="M 64 140 L 448 140 L 428 162 L 84 162 Z" fill="url(#wingGrad)" />

    <!-- Outer Shield Border -->
    <path d="M 112 168 
             L 400 168 
             L 400 200 
             L 348 288 
             L 256 388 
             L 164 288 
             L 112 200 Z" 
          fill="url(#shieldGrad)" 
          stroke="#4ade80" 
          stroke-width="7" 
          stroke-linejoin="round" />

    <!-- Inner Shield Inset Line -->
    <path d="M 136 182 
             L 376 182 
             L 376 204 
             L 330 280 
             L 256 362 
             L 182 280 
             L 136 204 Z" 
          fill="#15803d" 
          stroke="#86efac" 
          stroke-width="3" 
          stroke-linejoin="round" 
          opacity="0.9" />

    <!-- Secondary Lower Chevron Accent Line -->
    <path d="M 148 306 
             L 256 424 
             L 364 306 
             L 384 322 
             L 256 460 
             L 128 322 Z" 
          fill="url(#shieldGrad)" 
          stroke="#4ade80" 
          stroke-width="4" 
          stroke-linejoin="round" />
  </g>

  <!-- Monogram JE Text -->
  <text x="256" y="258" 
        font-family="system-ui, -apple-system, 'Outfit', 'Inter', 'Montserrat', sans-serif" 
        font-size="116" 
        font-weight="900" 
        letter-spacing="3"
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central"
        style="filter: drop-shadow(0px 4px 8px rgba(0,0,0,0.5));">JE</text>
</svg>
